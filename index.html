<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HueShift Packs</title>
    <meta name="theme-color" content="#14151a" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <header class="app-header">
        <h1 class="app-title">HueShift Packs</h1>
        <div class="allowance">
            Packs today: <strong id="allowance-count">–</strong>
            <button id="reset-allowance-btn" class="allowance-reset" title="Dev: reset today's pack allowance">reset</button>
        </div>
    </header>

    <nav class="tabs">
        <button class="tab-btn active" data-view="view-open">Open Packs</button>
        <button class="tab-btn" data-view="view-collection">Collection</button>
    </nav>

    <main id="view-open" class="view active">
        <div id="open-stage" class="open-stage">
            <button id="pack-btn" class="pack">
                <span class="ember" style="--ember-x:-30px; --ember-delay:0s"></span>
                <span class="ember" style="--ember-x:10px; --ember-delay:0.9s"></span>
                <span class="ember" style="--ember-x:40px; --ember-delay:1.8s"></span>
                <span class="ember" style="--ember-x:-55px; --ember-delay:2.6s"></span>
                <span class="ember" style="--ember-x:60px; --ember-delay:3.4s"></span>
                <svg id="pack-progress-ring" class="pack-progress-ring" viewBox="0 0 100 100">
                    <circle class="pack-progress-ring-bg" cx="50" cy="50" r="46"></circle>
                    <circle id="pack-progress-ring-fg" class="pack-progress-ring-fg" cx="50" cy="50" r="46"></circle>
                </svg>
                <span class="pack-label"><i class="fas fa-layer-group"></i>Booster Pack</span>
            </button>
            <p id="open-hint" class="open-hint">Loading catalog…</p>

            <div id="reveal-row" class="reveal-row"></div>

            <p id="pack-summary" class="pack-summary" style="display:none"></p>

            <div id="reveal-actions" class="reveal-actions" style="display:none">
                <button id="reveal-all-btn" class="btn">Reveal All</button>
                <button id="again-btn" class="btn secondary">Done</button>
            </div>
        </div>
    </main>

    <main id="view-collection" class="view">
        <div class="collection-header">
            <h2 class="app-title">Your Collection</h2>
        </div>
        <div id="collection-root"></div>
    </main>

    <div id="card-modal" class="card-modal-overlay">
        <button id="card-modal-close" class="card-modal-close" aria-label="Close">&times;</button>
        <div id="card-modal-flip" class="card-modal-flip">
            <div class="card-modal-face card-modal-back"><i class="fas fa-question"></i></div>
            <div id="card-modal-front" class="card-modal-face card-modal-front"></div>
        </div>
        <p class="card-modal-hint">Tap the card to flip it</p>
    </div>

    <div id="legendary-spotlight" class="legendary-spotlight-overlay"></div>
    <div id="new-toast" class="new-toast"></div>
    <div id="fx-flash" class="fx-flash"></div>
    <div id="fx-vignette" class="fx-vignette"></div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
    <script type="module" src="js/app.js"></script>
    <script>
        // Service worker registration is off while we're actively iterating on css/js —
        // a stale cached worker was masking edits. This actively tears down any worker
        // left over from earlier testing so pages self-heal without manual DevTools steps.
        // Re-enable registration (see service-worker.js) once the app has stabilized.
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then((regs) => {
                regs.forEach((reg) => reg.unregister());
            });
        }
        if ("caches" in window) {
            caches.keys().then((keys) => keys.forEach((key) => caches.delete(key)));
        }
    </script>
</body>

</html>
